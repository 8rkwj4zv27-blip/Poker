<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Chip Lab</title>
  <!-- Phone-first: the coin economy, round 4: chip coins (the same gold
       coin, its value in its colour), the bank a pot of them, in and out
       through a slot. The real game full screen on the Showdown Lab's host;
       the controls run inside it (js/chip-lab.js). The candidate coin files
       stand in for the shipped ones in the copy only. Never linked from the
       game; never touches a save. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #sdl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #sdl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="sdl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the candidate coin files in place of
       the shipped ones (strip), and the lab's controls. The bundler
       (validation/tools/lab-bundle.js) reads this to bake the copy. -->
  <script type="application/json" id="lab-inject">{"css":["css/showdown-lab.css","css/coin-denom-lab.css","css/coin-hoard.css","css/chip-lab.css"],"js":["js/chip-world.js","js/chip-table.js","js/chip-lab.js"],"strip":["js/coin-world.js","js/coin-table.js"],"v":"5"}</script>
  <script src="js/showdown-lab-host.js?v=7"></script>
</body>
</html>
