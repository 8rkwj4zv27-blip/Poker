<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Pack Lab</title>
  <!-- Phone-first Lab: Career as packs of event cards (docs/career/PACKS_PLAN.md).
       The page is just the real game, full screen, with Career replaced by
       the pack vendor; the lab's controls run inside it (js/pack-lab.js: a
       TUNE key and a bottom sheet). Never linked from the game; never
       touches a real save (the copy runs on in-memory storage). -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #pk-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #pk-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="pk-game" title="Poker Faces (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy. The bundler
       (validation/tools/lab-bundle.js) reads this to bake the copy. -->
  <script type="application/json" id="lab-inject">{"css":["css/pack-lab.css"],"js":["js/pack-lab-art.js","js/pack-lab-sound.js","js/pack-lab-cards.js","js/pack-lab.js"],"v":"1"}</script>
  <script src="js/pack-lab-host.js?v=1"></script>
</body>
</html>
