<title>Packet Machine · Poker Faces</title>
<!-- The packet machine lab (vending-lab.html on its branch) as a
     home-screen app: Share → Add to Home Screen. Everything in this
     folder is a self-contained copy staged by validation/tools/lab-bundle.js
     (game.html is a baked copy of the game with the lab's parts), so it
     shares nothing with the live game and changes nothing players
     download. It runs on in-memory storage and registers no service
     worker. Never linked from the game; delete the folder when the lab
     is done. -->
<script>(function(){var f=window.fetch;window.fetch=function(u,o){if(typeof u==="string"&&/(^|\/)index\.html$/.test(u.split(/[?#]/)[0]))u=u.replace(/index\.html/,"game.html");return f.call(this,u,o);};window.EC_LAB_GAME=window.SD_LAB_GAME=window.LAB_GAME="game.html";window.LAB_STATIC=true;})();</script>
<style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #pk-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #pk-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
<iframe id="pk-game" title="Poker Faces (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy. The bundler
       (validation/tools/lab-bundle.js) reads this to bake the copy. -->
  <script type="application/json" id="lab-inject">{"css":["css/pack-ritual-cards.css","css/pack-opening.css","css/card-inspect.css","css/career-main.css","css/vending-machine.css"],"js":["js/pack-ritual-art.js","js/pack-ritual-cards.js","js/pack-opening-core.js","js/pack-opening-packet.js","js/event-cards.js","js/card-inspect.js","js/career-main.js","js/vending-machine.js","js/pack-opening.js"],"v":"3","strip":["js/home-boot.js"]}</script>
  <script src="js/pack-opening-host.js?v=2"></script>
</body>
</html>
