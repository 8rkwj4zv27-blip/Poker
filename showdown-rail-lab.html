<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16090D">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<title>Showdown Rail Lab</title>

<!-- Production visual system, in production order. -->
<link rel="stylesheet" href="css/01-foundation.css">
<link rel="stylesheet" href="css/02-screens.css">
<link rel="stylesheet" href="css/03-action-console.css">
<link rel="stylesheet" href="css/04-overlays-and-modes.css">
<link rel="stylesheet" href="css/05-responsive-and-arcade.css">
<link rel="stylesheet" href="css/06-machine-system.css">
<link rel="stylesheet" href="css/showdown-rail-lab.css">
</head>
<body data-theme="emerald" data-motion="on" class="sdr-body">
  <main class="sdr-lab">
    <header class="sdr-toolbar pc-material-leather">
      <div class="sdr-title-row">
        <div>
          <span class="sdr-kicker">Presentation prototype</span>
          <h1>Showdown Rail</h1>
        </div>
        <span class="sdr-state" id="sdr-state" aria-live="polite">Ready</span>
      </div>
      <label class="sdr-field" for="sdr-fixture">
        <span>Fixture</span>
        <select id="sdr-fixture" aria-label="Showdown fixture"></select>
      </label>
      <div class="sdr-controls" aria-label="Prototype controls">
        <button id="sdr-before" type="button">Before</button>
        <button id="sdr-replay" type="button" class="is-primary">Replay</button>
        <div class="sdr-motion" role="group" aria-label="Motion preview">
          <button type="button" data-motion-choice="on" class="active" aria-pressed="true">Normal</button>
          <button type="button" data-motion-choice="off" aria-pressed="false">Reduced</button>
        </div>
      </div>
      <p id="sdr-note" class="sdr-note"></p>
    </header>

    <section class="sdr-table-shell pc-material-leather" aria-label="Deterministic showdown table">
      <div class="sdr-table" id="sdr-table">
        <div class="sdr-felt-grain" aria-hidden="true"></div>
        <div class="sdr-seats" id="sdr-seats"></div>
        <div class="sdr-board-zone">
          <span class="sdr-board-label">Community</span>
          <div class="sdr-board" id="sdr-board" aria-label="Community cards"></div>
          <div class="sdr-pot" id="sdr-pot">Pot</div>
        </div>
        <div class="sdr-connection" aria-hidden="true"></div>
        <div class="sdr-rail" id="sdr-rail" aria-label="Winning five-card rail">
          <div class="sdr-rail-label">Winning five</div>
          <div class="sdr-rail-cards" id="sdr-rail-cards"></div>
          <div class="sdr-result-copy">
            <strong id="sdr-winner"></strong>
            <span id="sdr-hand"></span>
            <em id="sdr-award"></em>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Production evaluator and production card renderer. No game engine,
       table state, save system, AI or showdown sequencer is loaded. -->
  <script src="js/01-poker-math.js"></script>
  <script src="js/06-presentation.js"></script>
  <script src="js/showdown-rail-model.js"></script>
  <script src="js/showdown-rail-lab.js"></script>
</body>
</html>
