<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16090D">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<title>Showdown Rail Lab</title>

<!-- The shipped visual system, in the same order as the game. -->
<link rel="stylesheet" href="css/01-foundation.css">
<link rel="stylesheet" href="css/02-screens.css">
<link rel="stylesheet" href="css/03-action-console.css">
<link rel="stylesheet" href="css/04-overlays-and-modes.css">
<link rel="stylesheet" href="css/05-responsive-and-arcade.css">
<link rel="stylesheet" href="css/06-machine-system.css">
<link rel="stylesheet" href="css/showdown-rail-lab.css">
</head>
<body data-theme="emerald" data-motion="on" data-cardback="classic" class="sdr-body">
  <details class="sdr-dev-panel" id="sdr-dev-panel" open>
    <summary>
      <span>Showdown Lab</span>
      <strong id="sdr-state" aria-live="polite">Loading production table…</strong>
    </summary>
    <div class="sdr-dev-controls">
      <label class="sdr-field" for="sdr-fixture">
        <span>Fixture</span>
        <select id="sdr-fixture" aria-label="Showdown fixture"></select>
      </label>
      <label class="sdr-field" for="sdr-theme">
        <span>Theme</span>
        <select id="sdr-theme" aria-label="Table theme">
          <option value="emerald">Emerald</option>
          <option value="midnight">Midnight</option>
          <option value="burgundy">Burgundy</option>
          <option value="slate">Slate</option>
        </select>
      </label>
      <div class="sdr-button-row" aria-label="Preview controls">
        <button id="sdr-before" type="button">Before</button>
        <button id="sdr-replay" type="button" class="is-primary">Winning five</button>
        <button id="sdr-live" type="button">Live rail</button>
        <button id="sdr-full" type="button">Full sequence</button>
      </div>
      <div class="sdr-motion" role="group" aria-label="Motion preview">
        <button type="button" data-motion-choice="on" class="active" aria-pressed="true">Normal motion</button>
        <button type="button" data-motion-choice="off" aria-pressed="false">Reduced motion</button>
      </div>
      <p id="sdr-note" class="sdr-note"></p>
      <output id="sdr-sampler" class="sdr-sampler">Frame sampler waits for a replay.</output>
      <p class="sdr-dev-hint">Collapse this panel for a clean table-only view.</p>
    </div>
  </details>

  <!-- index.html's real #table-screen is fetched, cloned and mounted here.
       The live app initializer is never loaded, so fixture state remains
       memory-only and cannot replace a table, bankroll or Career save. -->
  <div id="app" class="sdr-production-host">
    <div class="sdr-loading" id="sdr-production-mount">Mounting production table…</div>
  </div>

  <!-- Production data, faces, scoring presentation, game helpers and table
       renderer; deliberately no 07-ui-wiring.js or 08-dev-mode.js. -->
  <script src="js/01-poker-math.js"></script>
  <script src="js/02-support-systems.js"></script>
  <script src="js/03-opponents.js"></script>
  <script src="js/04-modes-and-scoring.js"></script>
  <script src="js/05-game-engine.js"></script>
  <script src="js/06-presentation.js"></script>
  <script src="js/showdown-rail-model.js"></script>
  <script src="js/showdown-rail-lab.js"></script>
</body>
</html>
