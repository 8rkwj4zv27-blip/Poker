<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Workshop Skins</title>
  <!-- Phone-first Lab: the real game (v0.61.0) full screen, opened on the
       Workshop, for the owner to try the new chip skins, card faces and
       screen looks. Nothing is injected but the opener
       (js/workshop-skins-lab.js); the copy runs on in-memory storage, so
       it never touches a real save. Never linked from the game. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #lab-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #lab-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="lab-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <script type="application/json" id="lab-inject">{"css":[],"js":["js/workshop-skins-lab.js"],"v":"1"}</script>
  <script>(function(){ var f = document.getElementById('lab-game'); f.src = window.LAB_STATIC ? 'game.html?t=' + Date.now() : 'index.html'; })();</script>
</body>
</html>
