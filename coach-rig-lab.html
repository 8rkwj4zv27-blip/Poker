<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Coach Rig Lab</title>
  <!-- Phone-first Lab (round 1): the coach's lead and his boot, on the
       look locked in the Coach Face Lab (CUBE, DASHBOARD, CLEAN, from under
       the table). The page is just the real game, full screen; the lab's
       controls run inside it (js/coach-rig-lab.js: a TUNE key and a bottom
       sheet). Never linked from the game; never touches a real save.
       Plan: docs/coach/COACH_PLAN.md. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #crl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #crl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="crl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the candidate and the lab's controls.
       The bundler (validation/tools/lab-bundle.js) reads this to bake it. -->
  <script type="application/json" id="lab-inject">{"css":["css/coach-set.css","css/showdown-lab.css","css/coach-face-lab.css"],"js":["js/coach-set.js","js/coach-rig-lab.js"],"v":"1"}</script>
  <script src="js/coach-rig-lab-host.js?v=1"></script>
</body>
</html>
