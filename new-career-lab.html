<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>New Career Lab</title>
  <!-- Phone-first Lab (v0.71.0): the real game, full screen, on a new
       Career made up for trying things (ten cards, three on the tray);
       the lab's controls run inside it (js/new-career-lab.js: a TUNE key
       and a bottom sheet). For the owner's sign-off on the event clock and
       the curated tray. Never linked from the game; never touches a real
       save (the copy runs on in-memory storage). -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #ncl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #ncl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="ncl-game" title="Poker Faces (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the lab's controls. The bundler
       (validation/tools/lab-bundle.js) reads this to bake the copy. -->
  <script type="application/json" id="lab-inject">{"css":["css/new-career-lab.css"],"js":["js/new-career-lab.js"],"strip":[],"v":"1"}</script>
  <script src="js/new-career-lab-host.js?v=1"></script>
</body>
</html>
