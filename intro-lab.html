<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <title>Poker Faces — Table Intro Lab</title>
  <link rel="stylesheet" href="css/intro-lab.css?v=2">
  <script defer src="js/intro-lab.js?v=2"></script>
</head>
<body class="il-body">
  <!-- The real game, sandboxed: in-memory storage, no service worker.
       Nothing played in here can touch a real save. -->
  <div class="il-stage">
    <iframe class="il-frame" id="il-frame" title="Poker Faces (sandboxed copy)"></iframe>
  </div>

  <button class="il-tab" id="il-tab" type="button" aria-expanded="true" aria-controls="il-panel">INTRO</button>

  <aside class="il-panel" id="il-panel" aria-label="Table intro lab controls">
    <header class="il-head">
      <strong>TABLE INTRO</strong>
      <span id="il-status">LOADING…</span>
    </header>

    <section class="il-group" aria-label="Arrive at a table">
      <div class="il-label">ARRIVE AT</div>
      <div class="il-runs">
        <button type="button" class="is-wide" data-run="event">CAREER EVENT ▸</button>
        <button type="button" data-run="cash">CASH TABLE</button>
        <button type="button" data-run="resume">RESUME EVENT</button>
        <button type="button" class="is-wide" data-run="single">SINGLE PLAYER</button>
      </div>
      <p class="il-note">Career buttons go through the real Hub: the ticket is fed in, then the table rolls in. Tap the game during the intro to skip it.</p>
    </section>

    <section class="il-group">
      <div class="il-row"><span class="il-label">EVENT</span>
        <div class="il-seg" data-key="event">
          <button data-v="back-room-freezeout">3-HAND</button>
          <button data-v="pub-open">5-HAND</button>
          <button data-v="casino-main">MAIN</button>
          <button data-v="high-roller-feature">HIGH ROLL</button>
          <button data-v="invitational-final">FINAL</button>
        </div></div>
      <div class="il-row"><span class="il-label">SP OPPONENTS</span>
        <div class="il-seg" data-key="opponents"><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div></div>
      <div class="il-row"><span class="il-label">TICKET FEED</span>
        <div class="il-seg" data-key="feed"><button data-v="on">NEW</button><button data-v="off">OLD</button></div></div>
      <div class="il-row"><span class="il-label">TABLE INTRO</span>
        <div class="il-seg" data-key="intro"><button data-v="on">NEW</button><button data-v="off">OLD</button></div></div>
      <div class="il-row"><span class="il-label">SPEED</span>
        <div class="il-seg" data-key="speed"><button data-v="1">1×</button><button data-v="0.5">½×</button><button data-v="0.25">¼×</button></div></div>
      <div class="il-row"><span class="il-label">SOUND</span>
        <div class="il-seg" data-key="sound"><button data-v="on">ON</button><button data-v="off">OFF</button></div></div>
    </section>

    <footer class="il-foot">
      <button type="button" id="il-reset">RESET GAME</button>
      <span>Sandboxed · no saves touched</span>
    </footer>
  </aside>
</body>
</html>
