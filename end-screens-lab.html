<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>End Screens Lab</title>
  <!-- Phone-first Lab (round 1). The page is just the real game, full
       screen; the lab's controls run inside it (js/end-screens-lab.js: a
       TUNE key and a bottom sheet). EVENT WON / EVENT LOST with the chip
       tape, bust-out order, best hand and luck meter; the wreck that stays;
       P.I.P. sent to the moon. Never linked from the game; never touches a
       real save (the copy runs on in-memory storage). -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #esl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #esl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="esl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: only the lab's controls. The end
       screens themselves are the game's own (js/event-tape.js and friends).
       The bundler (validation/tools/lab-bundle.js) reads this to bake it. -->
  <script type="application/json" id="lab-inject">{"css":["css/end-screens-lab.css"],"js":["js/end-screens-lab.js"],"v":"1"}</script>
  <script src="js/end-screens-lab-host.js?v=1"></script>
</body>
</html>
