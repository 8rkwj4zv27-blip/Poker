<!DOCTYPE html>
<html lang="en">
<head>

  <title>Deal Style Lab</title>
  <!-- Phone-first Lab: how cards fly off the deck (docs/ui/DEAL_STYLES_PLAN.md).
       The page is just the real game, full screen; the controls run inside
       it (js/deal-style-lab.js: a TUNE key and a sheet), the candidate is
       js/deal-styles.js + css/deal-styles.css. The host is the shared
       js/showdown-lab-host.js. Never linked from the game; never touches a
       real save (the copy runs on in-memory storage). -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #sdl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #sdl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="sdl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <script type="application/json" id="lab-inject">{"css":["css/showdown-lab.css","css/deal-styles.css","css/deal-style-lab.css"],"js":["js/deal-styles.js","js/deal-style-lab.js"],"v":"3"}</script>
  <script src="js/showdown-lab-host.js?v=7"></script>
</body>
</html>
