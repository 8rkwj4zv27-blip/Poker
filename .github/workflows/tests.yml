# Runs every check suite (npm test) on each pull request and on main:
# they need nothing but Node. A second job runs the browser checks.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The browser checks (npm run browser-checks): the play-test, the new
  # Career scenario and the lab suites, with real touch in an emulated
  # iPhone. Playwright and its Chromium are installed for this run only;
  # the game itself still has no dependencies.
  browser:
    name: browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run browser-checks
