<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Speech Lab</title>
  <!-- Phone-first Lab (round 2): how an opponent's line of table talk looks
       on the table. The page is just the real game, full screen; the lab's
       controls run inside it (js/speech-lab.js: a TUNE key, a SAY key and a
       bottom sheet). Never linked from the game; never touches a real save
       (the copy runs on in-memory storage). Plan: docs/ui/SPEECH_PLAN.md. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #spl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #spl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="spl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the candidate bubbles and the lab's
       controls. The bundler (validation/tools/lab-bundle.js) reads this. -->
  <script type="application/json" id="lab-inject">{"css":["css/speech-lab.css"],"js":["js/speech-lines.js","js/speech-voice.js","js/speech-lab.js"],"v":"2"}</script>
  <script src="js/speech-lab-host.js?v=2"></script>
</body>
</html>
