<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Felt Lab</title>
  <!-- Phone-first Lab: the table's rail, felt, stitching, light and
       markings. The page is just the real game, full screen, sized for an
       iPhone 15 Pro Max (430 wide); the lab's controls run inside it
       (js/felt-lab.js: a TUNE key, look arrows and a bottom sheet). This
       host only loads the game copy and keeps the picks across a scene
       change. Never linked from the game; never touches a real save (the
       copy runs on in-memory storage). Pattern: showdown-lab.html. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #fl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #fl-game{ max-height:932px; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="fl-game" title="The Table (felt lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy (read by validation/tools/lab-bundle.js). -->
  <script type="application/json" id="lab-inject">{"css":["css/felt-lab.css"],"js":["js/felt-lab.js"],"v":"1"}</script>
  <script src="js/felt-lab-host.js?v=1"></script>
</body>
</html>
