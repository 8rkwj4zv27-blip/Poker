<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Coach Face Lab</title>
  <!-- Phone-first Lab (round 1): the coach's face. The page is just the
       real game, full screen; the lab's controls run inside it
       (js/coach-face-lab.js: a TUNE key and a bottom sheet). This host
       only loads the game copy and remembers the picks across DEAL AGAIN.
       Never linked from the game; never touches a real save (the copy
       runs on in-memory storage). Plan: docs/coach/COACH_PLAN.md. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #cfl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #cfl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="cfl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the candidate and the lab's controls.
       The bundler (validation/tools/lab-bundle.js) reads this to bake it. -->
  <script type="application/json" id="lab-inject">{"css":["css/coach-face.css","css/showdown-lab.css","css/coach-face-lab.css"],"js":["js/coach-face.js","js/coach-face-lab.js"],"v":"1"}</script>
  <script src="js/coach-face-lab-host.js?v=1"></script>
</body>
</html>
