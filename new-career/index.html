<!-- New Career (preview) as a home-screen app: Share → Add to Home Screen.
     Everything in this folder is a self-contained copy of
     career-preview-lab.html staged by validation/tools/lab-bundle.js
     (game.html is a baked copy of the game with the hub, shop, opening and
     album, wired to a real Career by js/career-link.js). It keeps its own
     save, under the "ncp:" prefix in this site's storage, so the real
     game's Career, settings and lifetime stats are never touched. No
     service worker of its own. Re-stage it after a change to the preview;
     delete the folder when New Career moves into the game. -->
<script>(function(){var f=window.fetch;window.fetch=function(u,o){if(typeof u==="string"&&/(^|\/)index\.html$/.test(u.split(/[?#]/)[0]))u=u.replace(/index\.html/,"game.html");return f.call(this,u,o);};window.EC_LAB_GAME=window.SD_LAB_GAME=window.LAB_GAME="game.html";window.LAB_STATIC=true;})();</script>
<style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #ncp-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #ncp-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
