       decisions before the flop and says so: a word right after you act,
       the reason after the hand, a lesson the first time it comes up.
       The page is just the real game, full screen; the lab's controls run
       inside it (js/coach-brain-lab.js: a TUNE key and a bottom sheet).
       Never linked from the game; never touches a real save.
       Plan: docs/coach/BRAIN_PLAN.md. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #cbl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #cbl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>

  <iframe id="cbl-game" title="The Table (lab copy)" allow="autoplay"></iframe>

       in the game now). The bundler (validation/tools/lab-bundle.js) reads
       this to bake it. -->
  <script type="application/json" id="lab-inject">{"css":["css/showdown-lab.css","css/coach-face-lab.css"],"js":["js/coach-brain-lab.js"],"v":"6"}</script>
