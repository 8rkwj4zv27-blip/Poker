<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A101C">
  <link rel="icon" href="data:,">
  <title>CRT Lab</title>
  <!-- CRT Lab: every CRT screen in the game rebuilt on the candidate CRT
       component (css/crt.css + js/crt.js), with presets from mild to
       extreme and dials for each effect. Isolated like the other Labs:
       production never links here and nothing here touches a save; the
       chosen recipe lives only in the address (#…). -->
  <link rel="stylesheet" href="css/01-foundation.css">
  <link rel="stylesheet" href="css/crt.css">
  <style>
    html,body{ height:auto; overflow:visible; user-select:text; -webkit-user-select:text; }
    body{ margin:0; padding:0 0 60px; background:var(--bg-deep); color:var(--ink); font:15px/1.5 var(--font-px); }
    #lab{ position:static; height:auto; max-width:760px; margin:0 auto; padding:0 12px; }

    /* control deck */
    .deck{ position:sticky; top:0; z-index:20; margin:0 -12px; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
      background:var(--panel); border-bottom:3px solid #000; box-shadow:0 4px 0 rgba(0,0,0,.4); }
    .deck h1{ margin:0 0 8px; font:12px var(--font-hdr); color:var(--accent-bright); letter-spacing:.06em; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .deck h1 small{ font:12px var(--font-px); color:var(--ink-faint); letter-spacing:0; }
    .presets{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
    .presets button{ padding:8px 2px 7px; }
    .presets b{ display:block; font:9px var(--font-hdr); }
    .presets span{ display:block; font:11px var(--font-px); color:inherit; opacity:.75; margin-top:3px; }
    .row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
    .row button{ flex:1 1 auto; }
    .key{ font:9px var(--font-hdr); letter-spacing:.04em; text-transform:uppercase; color:#1b1308; background:#D9C894;
      border:2px solid #0b0806; border-radius:3px; box-shadow:0 3px 0 #6f6140,inset 2px 2px 0 #FFF0BD; padding:9px 8px 8px; cursor:pointer; }
    .key:active{ transform:translateY(2px); box-shadow:0 1px 0 #6f6140,inset 2px 2px 0 #FFF0BD; }
    .key[aria-pressed="true"]{ background:var(--accent); box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 50%,black),inset 2px 2px 0 rgba(255,255,255,.35); }
    .recipe{ display:flex; gap:6px; align-items:center; margin-top:8px; }
    .recipe code{ flex:1; min-width:0; font:11px/1.35 ui-monospace,Menlo,monospace; color:var(--accent-bright); background:#000; border:2px solid #000; padding:6px 7px; overflow-wrap:anywhere; }

    details.dials{ margin-top:8px; }
    details.dials summary{ font:9px var(--font-hdr); color:var(--ink-dim); cursor:pointer; padding:4px 0; letter-spacing:.06em; }
    .dial{ display:grid; grid-template-columns:78px 1fr; gap:8px; align-items:center; margin-top:6px; }
    .dial label{ font:11px var(--font-px); color:var(--ink-dim); }
    .seg{ display:flex; gap:3px; flex-wrap:wrap; }
    .seg button{ flex:1 1 0; min-width:34px; padding:6px 2px; font:10px var(--font-px); font-weight:700; }

    /* screens */
    .group{ margin-top:26px; }
    .group > h2{ font:11px var(--font-hdr); color:var(--accent-bright); letter-spacing:.08em; margin:0 0 4px; }
    .group > p{ margin:0 0 12px; color:var(--ink-faint); font-size:13px; }
    .item{ margin-bottom:16px; }
    .where{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:5px; }
    .where b{ font:8px var(--font-hdr); color:var(--ink); letter-spacing:.06em; text-transform:uppercase; }
    .where span{ font-size:12px; color:var(--ink-faint); }
    /* A housing in the colour theme's case colours, roughly as each screen is mounted. */
    .housing{ display:inline-flex; gap:8px; padding:7px; max-width:100%;
      background:repeating-conic-gradient(rgba(255,255,255,.03) 0 25%,transparent 0 50%) 0 0/6px 6px,var(--theme-case-raised);
      border:3px solid #05070a; border-top-color:var(--theme-case-hi); box-shadow:0 3px 0 #000,inset 2px 2px 0 rgba(255,255,255,.08); }
    .housing.pair{ display:flex; }
    .housing.pair .crt{ flex:1 1 0; }
    .crt{ max-width:100%; }
    /* mock playing cards for the trophy */
    .mcard{ width:26px; height:37px; background:#F4EFE1; border:2px solid #22201C; border-radius:3px; color:#22201C;
      font:9px/1 var(--font-hdr); text-transform:none; padding:3px 2px; display:flex; flex-direction:column; gap:3px; }
    .mcard.red{ color:#C8322B; }

    select{ font:12px var(--font-px); background:#000; color:var(--ink); border:2px solid #000; padding:4px; }
    .note{ font-size:12px; color:var(--ink-faint); margin-top:20px; }
  </style>
</head>
<body>
<div id="lab">
  <div class="deck">
    <h1>CRT Lab <small id="build-note">every CRT in the game, one component</small></h1>
    <div class="presets" id="presets"></div>
    <div class="row">
      <button class="key" id="btn-change" type="button">Change content</button>
      <button class="key" id="btn-auto" type="button" aria-pressed="true">Auto</button>
      <button class="key" id="btn-glitch" type="button">Glitch now</button>
    </div>
    <div class="recipe"><code id="recipe"></code><button class="key" id="btn-copy" type="button">Copy</button></div>
    <details class="dials" id="dials-panel">
      <summary>DIALS · THEME · MOTION · SOUND</summary>
      <div id="dials"></div>
      <div class="dial"><label>Theme</label>
        <select id="theme"><option value="emerald">Emerald</option><option value="midnight" selected>Midnight</option><option value="burgundy">Burgundy</option><option value="slate">Slate</option></select></div>
      <div class="row">
        <button class="key" id="btn-motion" type="button" aria-pressed="false">Reduced Motion</button>
        <button class="key" id="btn-sound" type="button" aria-pressed="false">Crackle sound</button>
      </div>
    </details>
  </div>

  <div id="scope">
    <div id="screens"></div>
  </div>
  <p class="note">Screens are shown at their real size with sample content, mounted roughly as they are in the game. The recipe above is also saved in this page's address, so the link reopens your settings.</p>
</div>
<script src="js/crt.js"></script>
<script src="js/crt-lab.js"></script>
</body>
</html>
