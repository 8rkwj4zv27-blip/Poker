<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140709">
  <link rel="icon" href="data:,">
  <title>Coin Bank Lab</title>
  <!-- Phone-first Lab 2 of the coin economy pass: the inside of your bank
       (the same housing) holding your stack as small coins, big coins and
       bars: TUBES, SHELVES or HOPPER, with making change and wins dropping
       in. The real game, full screen; the lab's controls run inside it
       (js/coin-bank-lab.js: a TUNE key and a bottom sheet), on the Showdown
       Lab's host. The candidate files stand in for the shipped coin files
       in the copy only. Never linked from the game; never touches a save. -->
  <style>
    html,body{ height:100%; margin:0; background:#140709; overflow:hidden; }
    #sdl-game{
      position:fixed; top:env(safe-area-inset-top,0px); left:50%;
      width:min(100vw,430px); height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
      transform:translateX(-50%); border:0; display:block; background:#0C1510;
    }
    @media (min-width:600px){ #sdl-game{ box-shadow:0 0 0 3px #080405,0 20px 60px rgba(0,0,0,.6); } }
  </style>
</head>
<body>
  <iframe id="sdl-game" title="The Table (lab copy)" allow="autoplay"></iframe>
  <!-- What goes into the game copy: the candidate coin files in place of
       the shipped ones (strip), and the lab's controls. The bundler
       (validation/tools/lab-bundle.js) reads this to bake the copy. -->
  <script type="application/json" id="lab-inject">{"css":["css/showdown-lab.css","css/coin-denom-lab.css","css/coin-bank.css"],"js":["js/coin-denom-world.js","js/coin-denom-table.js","js/coin-bank.js","js/coin-bank-lab.js"],"strip":["js/coin-world.js","js/coin-table.js"],"v":"2"}</script>
  <script src="js/showdown-lab-host.js?v=7"></script>
</body>
</html>
